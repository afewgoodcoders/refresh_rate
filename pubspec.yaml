name: refresh_rate
description: >-
  Request display refresh rates, measure Flutter frame cadence and phase
  timings, and export source-qualified benchmark reports and telemetry.
version: 2.0.0-dev.1
homepage: https://qoder.in/resources/refresh_rate
repository: https://github.com/afewgoodcoders/refresh_rate
issue_tracker: https://github.com/afewgoodcoders/refresh_rate/issues
documentation: https://pub.dev/documentation/refresh_rate/latest/

topics:
  - display
  - performance
  - animation
  - debug
  - ui

screenshots:
  - description: "Live FPS overlay showing 120 FPS with frame budget diagnostics"
    path: screenshots/fps.png
  - description: "Hz badge confirming 120Hz refresh rate on a real device"
    path: screenshots/hz.png

funding:
  - https://github.com/sponsors/qoder-official

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.7
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^22.0.0

flutter:
  plugin:
    platforms:
      android:
        package: in.qoder.refresh_rate
        pluginClass: RefreshRatePlugin
      ios:
        pluginClass: RefreshRatePlugin
      linux:
        pluginClass: RefreshRatePlugin
      macos:
        pluginClass: RefreshRatePlugin
      windows:
        pluginClass: RefreshRatePluginCApi
      web:
        pluginClass: RefreshRateWeb
        fileName: refresh_rate_web.dart
