name: refresh_rate
description: >-
  Request display refresh rates, measure Flutter frame cadence and phase
  timings, and export source-qualified benchmark reports and telemetry.
version: 2.0.1
homepage: https://afewgoodcoders.com
repository: https://github.com/afewgoodcoders/refresh_rate
issue_tracker: https://github.com/afewgoodcoders/refresh_rate/issues
documentation: https://pub.dev/documentation/refresh_rate/latest/

topics:
  - display
  - performance
  - animation
  - debug
  - ui

screenshots:
  - description: "Compact FPS badge using illustrative frame samples"
    path: screenshots/fps.png
  - description: "Native display refresh-rate badge captured on Android"
    path: screenshots/hz.png
  - description: "Performance HUD using illustrative frame samples"
    path: screenshots/hud.png

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.7
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: 22.7.4

flutter:
  plugin:
    platforms:
      android:
        package: in.qoder.refresh_rate
        pluginClass: RefreshRatePlugin
      ios:
        pluginClass: RefreshRatePlugin
      linux:
        pluginClass: RefreshRatePlugin
      macos:
        pluginClass: RefreshRatePlugin
      windows:
        pluginClass: RefreshRatePluginCApi
      web:
        pluginClass: RefreshRateWeb
        fileName: refresh_rate_web.dart
