name: refresh_rate
description: >-
  Request display refresh rates, measure Flutter frame cadence and phase
  timings, and export source-qualified benchmark reports and telemetry.
version: 1.0.3
homepage: https://www.afewgoodcoders.com
repository: https://github.com/afewgoodcoders/refresh_rate
issue_tracker: https://github.com/afewgoodcoders/refresh_rate/issues
documentation: https://pub.dev/documentation/refresh_rate/latest/

topics:
  - display
  - performance
  - animation
  - debug
  - ui

screenshots:
  - description: "Illustrative FPS overlay layout with frame budget diagnostics"
    path: screenshots/fps.png
  - description: "Illustrative refresh-rate badge layout"
    path: screenshots/hz.png

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.7
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^22.0.0

flutter:
  plugin:
    platforms:
      android:
        package: in.qoder.refresh_rate
        pluginClass: RefreshRatePlugin
      ios:
        pluginClass: RefreshRatePlugin
      linux:
        pluginClass: RefreshRatePlugin
      macos:
        pluginClass: RefreshRatePlugin
      windows:
        pluginClass: RefreshRatePluginCApi
      web:
        pluginClass: RefreshRateWeb
        fileName: refresh_rate_web.dart
