name: Validate
on:
  push:
  pull_request:
jobs:
  dart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter: ['3.24.5', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter == 'stable' && '' || matrix.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 scripts/check_apple_sources.py
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk --debug
          - os: macos-latest
            target: ios --simulator --debug
          - os: macos-latest
            target: macos --debug
          - os: windows-latest
            target: windows --debug
          - os: ubuntu-latest
            target: linux --debug
          - os: ubuntu-latest
            target: web
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: contains(matrix.target, 'apk')
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
        if: contains(matrix.target, 'linux')
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }}
        working-directory: example
